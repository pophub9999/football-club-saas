name: Probe Torreense Sports
on:
  push:
    branches: ['v2-visual-first']
    paths:
      - '.github/workflows/probe-sports.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Probe zerozero competitions
        run: |
          python - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept":"text/html,*/*","Accept-Language":"pt-PT,pt;q=0.9,en;q=0.7"}
          urls=[
            "https://www.zerozero.pt/competicao/liga-portuguesa-feminina?redirm=1",
            "https://www.zerozero.pt/competicao/i-divisao-futsal?redirm=1",
            "https://www.zerozero.pt/competicao/i-divisao-feminina-futsal?redirm=1"
          ]
          for u in urls:
            print("\nURL",u)
            try:
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read().decode("utf-8","ignore")
              print("STATUS",getattr(r,"status",200),"BYTES",len(body),"FINAL",r.geturl())
              soup=BeautifulSoup(body,"html.parser")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              tables=soup.find_all("table")
              print("TABLES",len(tables))
              for ti,t in enumerate(tables[:8]):
                rows=[]
                for tr in t.find_all("tr")[:8]:
                  row=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"])]
                  if row: rows.append(row)
                if rows: print("TABLE",ti,rows)
            except Exception as e:
              print("ERR",repr(e))
          PY
