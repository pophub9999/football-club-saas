name: Probe Torreense Sports
on:
  push:
    branches: ['v2-visual-first']
    paths:
      - '.github/workflows/probe-sports.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Probe calendar DOM
        run: |
          python - <<'PY'
          import urllib.request,re
          from bs4 import BeautifulSoup
          u="https://www.torreense.com/futebol-profissional/equipa-principal/calendario"
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"})
          with urllib.request.urlopen(req,timeout=25) as r: body=r.read().decode("utf-8","ignore")
          soup=BeautifulSoup(body,"html.parser")
          for s in soup.find_all(string=re.compile(r"J7")):
            print("TEXTNODE",repr(s))
            p=s.parent
            for depth in range(6):
              if not p: break
              print("DEPTH",depth,"TAG",p.name,"CLASS",p.get("class"),"ID",p.get("id"))
              print(str(p)[:5000].replace("\n"," "))
              p=p.parent
              print("---")
            break
          PY
