name: Probe Torreense Sports
on:
  push:
    branches: ['v2-visual-first']
    paths:
      - '.github/workflows/probe-sports.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Probe FPF current competitions
        run: |
          python - <<'PY'
          import urllib.request,re,urllib.parse
          from bs4 import BeautifulSoup
          UA={"User-Agent":"Mozilla/5.0","Accept":"text/html,*/*"}
          urls=[
            "https://resultados.fpf.pt/",
            "https://resultados.fpf.pt/Competition",
            "https://resultados.fpf.pt/Competition/Details?seasonId=101&competitionId=19539",
            "https://resultados.fpf.pt/Competition/Details?seasonId=101&competitionId=18535",
          ]
          for u in urls:
            print("\nURL",u)
            try:
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read().decode("utf-8","ignore")
              print("STATUS",getattr(r,"status",200),"BYTES",len(body),"FINAL",r.geturl())
              soup=BeautifulSoup(body,"html.parser")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              for sel in soup.find_all("select"):
                txt=" | ".join(o.get_text(" ",strip=True)+":"+str(o.get("value")) for o in sel.find_all("option")[:30])
                if "2026" in txt or "época" in (sel.get("name") or "").lower() or "season" in (sel.get("name") or "").lower():
                  print("SELECT",sel.get("name"),sel.get("id"),txt[:2500])
              links=[]
              for a in soup.find_all("a",href=True):
                label=a.get_text(" ",strip=True)
                href=urllib.parse.urljoin(u,a["href"])
                if any(k in (label+" "+href).lower() for k in ["liga bpi","liga placard","feminina placard","competition/details"]):
                  links.append((label,href))
              print("LINKS",links[:100])
              for pat in [r'competitionId[=:](\d+)',r'seasonId[=:](\d+)']:
                vals=sorted(set(re.findall(pat,body,re.I)))
                print("PAT",pat,vals[-40:])
              print("HAS_2026_2027", "2026-2027" in body or "2026/2027" in body)
            except Exception as e:
              print("ERR",repr(e))
          PY
