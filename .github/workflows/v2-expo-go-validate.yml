name: V2 Expo Go Validate

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/v2-expo-go-validate.yml'

# Validate trigger: calendar tabs and rich past match details
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: v2-app
        run: npm install
      - name: Expo Doctor
        working-directory: v2-app
        run: npx expo-doctor
      - name: Export Android bundle
        working-directory: v2-app
        run: npx expo export --platform android --output-dir dist-android-check
      - name: Export iOS bundle
        working-directory: v2-app
        run: npx expo export --platform ios --output-dir dist-ios-check
