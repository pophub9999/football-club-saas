name: Probe Torreense Benefits
# missing advantage cards trigger

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/probe-torreense.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: pip install beautifulsoup4 -q
      - run: python scripts/probe_benefits.py
