name: Sync Torreense Benefits
# merge official advantages trigger

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/sync-benefits.yml'
  schedule:
    - cron: '37 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: pip install beautifulsoup4 -q
      - name: Sync official Torreense benefits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_benefits.py
