name: V2 GitHub Pages Preview
# Deploy trigger: calendar squads cleanup
# Builds the latest V2 branch into GitHub Pages.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v2-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: v2-app
        run: npm install

      - name: Set GitHub Pages base URL
        working-directory: v2-app
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.experiments={...(p.expo.experiments||{}),baseUrl:'/football-club-saas'}; fs.writeFileSync('app.json',JSON.stringify(p,null,2)+'\n');"

      - name: Export web
        working-directory: v2-app
        run: npx expo export --platform web

      - name: Disable Jekyll
        run: touch v2-app/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: v2-app/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
