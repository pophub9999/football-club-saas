name: Sync SCUTV Streams

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/sync-scutv.yml'
  schedule:
    - cron: '*/5 * * * *'

# Match guard: require date-compatible senior fixture
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install yt-dlp==2026.8.19
      - name: Sync SCUTV streams
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_scutv.py
