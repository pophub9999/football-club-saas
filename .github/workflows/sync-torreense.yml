name: Sync Torreense Data
# Sync trigger: persist news hero images
# Sports parser retry hardened
# App version refresh after sports sync

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/sync-torreense.yml'
  schedule:
    # Three daily refreshes (UTC): morning, afternoon and evening.
    - cron: '0 7,13,19 * * *'

concurrency:
  group: sync-torreense-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4
      - name: Sync official Torreense data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_torreense.py
