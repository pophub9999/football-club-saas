name: Install SCUT intro
on:
  push:
    branches: [v2-visual-first]
    paths:
      - .github/workflows/install-scut-intro.yml
permissions:
  contents: write
jobs:
  install:
    if: github.event.head_commit.message == 'Install new SCUT intro video'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-visual-first
      - name: Download intro
        env:
          VIDEO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4429a017-3992-408b-9f2d-1c9959e82f03.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTI0NjQwNmY3ZmVlMTVjNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgxMjIwN30.loeHGtcPsSOo33eIqf8ls-71qyq5Sr8vWT9AOT1qzjk"
        run: |
          set -euo pipefail
          mkdir -p v2-app/assets
          curl -L --fail --retry 3 "$VIDEO_URL" -o v2-app/assets/scut-intro-storyboard.mp4
          test -s v2-app/assets/scut-intro-storyboard.mp4
          echo "Downloaded $(wc -c < v2-app/assets/scut-intro-storyboard.mp4) bytes"
      - name: Commit video
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-app/assets/scut-intro-storyboard.mp4
          if git diff --cached --quiet; then
            echo "No video change"
            exit 0
          fi
          git commit -m "Replace SCUT intro with 3-second video"
          git push origin HEAD:v2-visual-first
