name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL (include /v1)'
        required: false
        default: 'http://10.0.2.2:3000/v1'
        type: string
  push:
    branches: [backoffice-v2-games-content-tickets]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name football_club_app --org com.footballclub .

      - name: Remove generated Flutter project files
        run: |
          rm -f analysis_options.yaml
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:3000/v1' }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-club-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
